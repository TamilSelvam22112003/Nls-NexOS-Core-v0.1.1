name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/refimpl-py/requirements.txt
      - run: python -m unittest discover -s tools/refimpl-py -p 'test_*.py' -v
      - run: make fmt
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: ./...
          only-new-issues: false
      - run: make build test
